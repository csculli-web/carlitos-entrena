name: Generate approved app icons

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/generate-approved-icons.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Generate PNG icons from approved portrait embedded in index
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import base64, json, re

          index = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'data:image/webp;base64,([^"]+)', index)
          if not m:
              raise SystemExit("Approved embedded portrait not found in index.html")

          raw = base64.b64decode(m.group(1))
          img = Image.open(BytesIO(raw)).convert("RGB")

          for size in (192, 512):
              out = img.resize((size, size), Image.Resampling.LANCZOS)
              out.save(f"icon-{size}.png", "PNG", optimize=True)

          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          manifest["icons"] = [
              {"src":"./icon-192.png?v=20","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icon-512.png?v=20","sizes":"512x512","type":"image/png","purpose":"any"}
          ]
          Path("manifest.webmanifest").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          index = re.sub(r'Carlitos Entrena · v\d+ estable', 'Carlitos Entrena · v20 estable', index)
          index = re.sub(r'estable · v\d+', 'estable · v20', index)
          index = re.sub(r'<link rel="apple-touch-icon" href="[^"]+">', '<link rel="apple-touch-icon" href="./icon-192.png?v=20">', index)
          Path("index.html").write_text(index, encoding="utf-8")

          sw = Path("sw.js").read_text(encoding="utf-8")
          sw = re.sub(r'carlitos-entrena-v\d+', 'carlitos-entrena-v20', sw)
          Path("sw.js").write_text(sw, encoding="utf-8")
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png manifest.webmanifest index.html sw.js
          git commit -m "Use approved portrait as Android app icon v20 [skip ci]"
          git push
